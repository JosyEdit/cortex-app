<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1530">
<link rel="manifest" href="/manifest.json?t={{TOKEN}}">
<link rel="icon" href="/icon-192.png?v=3">
<link rel="apple-touch-icon" href="/icon-192.png?v=3">
<title>Connexion — Cortex</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:#12141a;color:#e8eaf0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
.boite{width:100%;max-width:380px;background:#181b23;border:1px solid #262a35;border-radius:14px;padding:24px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo img{width:48px;height:48px;border-radius:50%;border:2px solid #5b9dff;object-fit:cover}
h1{font-size:19px;margin:0}
p.mut{color:#8b97ad;font-size:14px;margin:2px 0 0}
label{display:block;font-size:13px;color:#9fb4d8;margin:14px 0 4px}
input{width:100%;background:#12141a;color:#e8eaf0;border:1px solid #313848;border-radius:9px;padding:11px;font-size:16px}
button{width:100%;margin-top:20px;background:#1d3a2a;color:#c8f0da;border:1px solid #2f6046;border-radius:9px;
       padding:12px;font-size:16px;cursor:pointer}
.erreur{background:#3a1f22;border:1px solid #6b3238;color:#f6d3d6;padding:10px 12px;border-radius:10px;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<form class="boite" method="post" action="/login?t={{TOKEN}}">
  <div class="logo"><img src="/icon-192.png" alt=""><div><h1>Cortex · JOSY EI</h1>
  <p class="mut">Connexion au centre de contrôle</p></div></div>
  {{MESSAGE}}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <label for="mdp">Mot de passe</label>
  <input id="mdp" name="mdp" type="password" autocomplete="current-password" required>
  <button>Se connecter</button>
  <p class="mut" style="margin-top:14px;text-align:center"><a href="/oubli?t={{TOKEN}}" style="color:#9fb4d8">Mot de passe oublié ?</a></p>
  <p class="mut" style="margin-top:8px;text-align:center"><a href="/inscription?t={{TOKEN}}" style="color:#9fb4d8">Créer un compte entreprise</a></p>
</form>
<script>try{Object.keys(sessionStorage).forEach(function(k){if(k.indexOf('cx_')===0)sessionStorage.removeItem(k);});}catch(e){}</script>
</body>
</html>
