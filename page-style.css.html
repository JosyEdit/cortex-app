<style>
/* Mise en page : une colonne de lecture, un bandeau prix, une grille de secteurs, un rapport type en « fiche de contrôle » */
.jei{--ink:#152238;--paper:#f5f7fa;--card:#ffffff;--line:#d9e0ea;--muted:#56637a;--ok:#0d7a5f;--okbg:#e5f4ee;--warn:#9a5b00;--warnbg:#fdf1dc;
--display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--body:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding:0 16px}
.jei *{box-sizing:border-box}
.jei .w{max-width:1040px;margin:0 auto;padding-block:56px;display:grid;gap:72px}
.jei h1,.jei h2,.jei h3{font-family:var(--display);color:var(--ink);text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.01em}
.jei h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.1}
.jei h2{font-size:clamp(1.5rem,3vw,2rem);line-height:1.2}
.jei h3{font-size:1.15rem;line-height:1.3}
.jei p{margin:0;max-width:65ch}
.jei .eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--ok)}
.jei .lead{font-size:1.15rem;color:var(--muted)}
.jei .stack{display:grid;gap:16px;align-content:start}
.jei .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center}
.jei .btn{display:inline-block;background:var(--ink);color:#fff!important;text-decoration:none!important;font-weight:600;padding:14px 26px;border-radius:6px;font-size:1rem}
.jei .btn:hover{background:var(--ok)}
.jei .btn:focus-visible{outline:3px solid var(--ok);outline-offset:3px}
.jei .meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.92rem;color:var(--muted)}
.jei .meta b{color:var(--ink)}
.jei .sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px;box-shadow:0 10px 30px -18px rgba(21,34,56,.35)}
.jei .sheet .hd{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.78rem;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:10px}
.jei .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:.95rem}
.jei .tag{font-family:var(--mono);font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.jei .tag.ok{background:var(--okbg);color:var(--ok)}
.jei .tag.warn{background:var(--warnbg);color:var(--warn)}
.jei .sheet .ft{font-size:.8rem;color:var(--muted)}
.jei .two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.jei ul.check{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.jei ul.check li{padding-left:28px;position:relative;max-width:60ch}
.jei ul.check li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:14px;border-radius:3px;border:2px solid var(--ok)}
.jei ol.get{margin:0;padding-left:1.3em;display:grid;gap:12px}
.jei ol.get li::marker{font-family:var(--display);font-weight:600;color:var(--ok)}
.jei .price{background:var(--ink);color:#fff;border-radius:10px;padding:36px;display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
.jei .price .num{font-family:var(--display);font-size:clamp(2.6rem,6vw,3.6rem);line-height:1;font-variant-numeric:tabular-nums}
.jei .price .num small{font-size:.35em;font-family:var(--body);opacity:.75;margin-left:6px}
.jei .price p{color:#d5dcea}
.jei .price .btn{background:#fff;color:var(--ink)!important}
.jei .price .btn:hover{background:var(--okbg)}
.jei .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
.jei .step{border-top:3px solid var(--ink);padding-top:16px;display:grid;gap:8px;align-content:start}
.jei .step span{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.jei .sectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.jei .sector{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:8px;align-content:start}
.jei .sector p{font-size:.95rem;color:var(--muted)}
.jei .faq{display:grid;gap:0;border-top:1px solid var(--line)}
.jei details{border-bottom:1px solid var(--line);padding:16px 0}
.jei summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
.jei summary::-webkit-details-marker{display:none}
.jei summary::after{content:"+";font-family:var(--mono);color:var(--ok)}
.jei details[open] summary::after{content:"–"}
.jei details p{margin-top:10px;color:var(--muted)}
.jei .end{text-align:center;display:grid;gap:16px;justify-items:center}
.jei .foot{border-top:1px solid var(--line);padding-top:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted)}
.jei .foot a{color:var(--muted)}
.jei .mail{font-family:var(--mono);user-select:all;color:var(--ink)}
@media (max-width:820px){.jei .hero,.jei .two{grid-template-columns:1fr;gap:32px}.jei .price{grid-template-columns:1fr;gap:16px;padding:28px}.jei .steps{grid-template-columns:1fr}.jei .w{gap:56px;padding-block:40px}}
@media (prefers-reduced-motion:reduce){.jei *{transition:none!important}}
</style>
