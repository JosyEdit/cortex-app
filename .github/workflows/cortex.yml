name: Cortex

on:
  # Planification retirée : le Cortex tourne sur le PC (tâche Windows).
  # Deux lecteurs getUpdates sur le même bot se volent les messages.
  workflow_dispatch:         # lancement manuel uniquement

permissions:
  contents: read

# Un seul cycle à la fois : évite que deux exécutions lisent les mêmes
# messages Telegram ou écrasent la mémoire l'une de l'autre.
concurrency:
  group: cortex
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Mémoire du Cortex (cortex.db) : restaurée depuis le cache du cycle précédent.
      - name: Restaurer la mémoire
        uses: actions/cache/restore@v4
        with:
          path: cortex.db
          key: cortex-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cortex-db-

      - name: Lancer un cycle du Cortex
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python cortex.py

      # Sauvegardée même si le cycle a échoué, pour ne perdre ni journal ni offset Telegram.
      - name: Sauvegarder la mémoire
        if: always() && hashFiles('cortex.db') != ''
        uses: actions/cache/save@v4
        with:
          path: cortex.db
          key: cortex-db-${{ github.run_id }}-${{ github.run_attempt }}
